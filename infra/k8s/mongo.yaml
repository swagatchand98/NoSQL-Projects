apiVersion: v1
kind: Namespace
metadata:
  name: college-mongo
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: college-mongo
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: mongo
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: college-mongo
spec:
  serviceName: mongo
  replicas: 3
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      initContainers:
        - name: key-permissions
          image: mongo:7.0
          command: [bash, -c, 'cp /secret/keyfile /key/keyfile && chown 999:999 /key/keyfile && chmod 400 /key/keyfile && chown 999:999 /data/db']
          volumeMounts:
            - {name: secret, mountPath: /secret, readOnly: true}
            - {name: key, mountPath: /key}
            - {name: data, mountPath: /data/db}
      containers:
        - name: mongo
          image: mongo:7.0
          command: [mongod, --replSet, kube, --bind_ip_all, --keyFile, /key/keyfile]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          ports:
            - containerPort: 27017
          readinessProbe:
            tcpSocket: {port: 27017}
            initialDelaySeconds: 10
          volumeMounts:
            - {name: key, mountPath: /key, readOnly: true}
            - {name: data, mountPath: /data/db}
            - {name: secret, mountPath: /secret, readOnly: true}
      volumes:
        - name: key
          emptyDir: {}
        - name: secret
          secret:
            secretName: mongo-auth
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
